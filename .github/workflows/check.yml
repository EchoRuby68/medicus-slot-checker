name: Check Medicus

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          echo "Run triggered by: $GITHUB_EVENT_NAME"
          date -u
          echo "Ref: $GITHUB_REF"
          echo "Run number: $GITHUB_RUN_NUMBER"
          python3 -V

      - name: Check appointments
        env:
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_DESTINATION: ${{ secrets.EMAIL_DESTINATION }}
        run: python3 check_medicus.py
